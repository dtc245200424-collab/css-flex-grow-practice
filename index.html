<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thực hành CSS flex-grow Property</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h2>Thực hành thuộc tính flex-grow (5 Flex Items)</h2>
    <p>
      Tất cả các ô đều có <code>flex-grow: 1</code>, riêng
      <strong>Ô thứ 2</strong> được thiết lập <code>flex-grow: 3</code> nên sẽ
      phát triển rộng hơn 4 ô còn lại.
    </p>

    <div class="container">
      <div class="item item1">Ô 1</div>
      <div class="item item2">Ô 2 (flex-grow: 3)</div>
      <div class="item item3">Ô 3</div>
      <div class="item item4">Ô 4</div>
      <div class="item item5">Ô 5</div>
    </div>
  </body>
</html>
